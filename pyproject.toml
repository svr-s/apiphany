[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apiphany"
version = "0.1.4"
authors = [
    { name="Vatsa", email="228140210+svr-s@users.noreply.github.com" },
]
description = "Apiphany is a declarative API orchestration engine. It enables developers to define complex API workflows—including authentication, pagination, chained requests, rate limiting, state tracking, and response extraction—through a fully validated configuration model. Powered by `httpx` and `asyncio`, Apiphany executes API workflows concurrently and seamlessly unpacks deeply nested JSON blobs into structured Pandas DataFrames or SQL tables."
readme = "README.md"
requires-python = ">=3.8"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "aiolimiter>=1.0.0",
    "pydantic>=2.0.0",
    "python-json-logger>=2.0.0",
    "pyyaml>=6.0",
    "json5>=0.9.0"
]

[project.urls]
Repository = "https://github.com/svr-s/apiphany"

[project.optional-dependencies]
aws = ["boto3>=1.26.0"]
sql = ["pandas>=1.5.0", "sqlalchemy>=2.0.0"]
